<!-- Default avatar SVG for students without photos -->
<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="url(#avatarGradient)"/>
  
  <!-- Head -->
  <circle cx="100" cy="80" r="35" fill="#ffffff" opacity="0.9"/>
  
  <!-- Body -->
  <ellipse cx="100" cy="160" rx="50" ry="55" fill="#ffffff" opacity="0.9"/>
  
  <!-- School icon -->
  <g transform="translate(85, 190)">
    <rect x="0" y="0" width="30" height="20" fill="#667eea" opacity="0.3"/>
    <polygon points="0,0 15,-10 30,0" fill="#667eea" opacity="0.3"/>
  </g>
</svg>
